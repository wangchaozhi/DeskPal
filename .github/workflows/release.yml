name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark this GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_NAME: DeskPal
  QT_VERSION: 6.10.0
  BUILD_TYPE: Release

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            aqt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            asset_name: DeskPal-windows-x64
          - os: macos-15-intel
            aqt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
            asset_name: DeskPal-macos-x64
          - os: macos-15
            aqt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=arm64
            asset_name: DeskPal-macos-arm64
          - os: macos-26-intel
            aqt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
            asset_name: DeskPal-macos26-x64
          - os: macos-26
            aqt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=arm64
            asset_name: DeskPal-macos26-arm64
          - os: ubuntu-22.04
            aqt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
            asset_name: DeskPal-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            desktop-file-utils \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            patchelf \
            wget \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xkb1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-v4-quick3d-shadertools-${{ runner.os }}-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-${{ matrix.qt_dir }}

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt "${{ matrix.aqt_host }}" desktop "${QT_VERSION}" "${{ matrix.qt_arch }}" -O "${RUNNER_TEMP}/Qt" --modules qtquick3d qtshadertools

      - name: Configure Qt environment
        shell: bash
        run: |
          qt_root="${RUNNER_TEMP}/Qt/${QT_VERSION}/${{ matrix.qt_dir }}"
          if [ ! -d "${qt_root}" ]; then
            echo "Qt root was not found: ${qt_root}" >&2
            echo "Installed Qt directories:"
            find "${RUNNER_TEMP}/Qt" -maxdepth 3 -type d | sort || true
            exit 1
          fi
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=${qt_root}" >> "${GITHUB_ENV}"
          echo "${qt_root}/bin" >> "${GITHUB_PATH}"
          for component in Qt6Quick3D Qt6ShaderTools; do
            config_path="${qt_root}/lib/cmake/${component}/${component}Config.cmake"
            if [ ! -f "${config_path}" ]; then
              echo "${component} config was not found: ${config_path}" >&2
              find "${qt_root}/lib/cmake" -maxdepth 2 -name '*Config.cmake' | sort || true
              exit 1
            fi
          done

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" ${{ matrix.cmake_extra_args || '' }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $PWD "package"
          $deployDir = Join-Path $packageRoot "${{ matrix.asset_name }}"
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null

          $exe = Get-ChildItem -Path build -Recurse -Filter "${env:APP_NAME}.exe" | Select-Object -First 1
          if (-not $exe) { throw "Executable was not found." }

          Copy-Item $exe.FullName $deployDir
          Copy-Item README.md $deployDir
          Copy-Item docs $deployDir -Recurse
          Copy-Item assets $deployDir -Recurse
          windeployqt --release --qmldir "$PWD\qml" `
            --no-virtualkeyboard --no-translations --no-system-d3d-compiler `
            "$deployDir\${env:APP_NAME}.exe"

          Compress-Archive -Path "$deployDir\*" -DestinationPath "$packageRoot\${{ matrix.asset_name }}.zip" -Force

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          app_path="$(find build -maxdepth 4 -name "${APP_NAME}.app" -print -quit)"
          if [ -z "${app_path}" ]; then
            echo "${APP_NAME}.app was not found." >&2
            exit 1
          fi

          macdeployqt "${app_path}" -qmldir="${PWD}/qml"
          codesign --force --deep --sign - "${app_path}"

          dmg_root="package/${{ matrix.asset_name }}"
          mkdir -p "${dmg_root}"
          cp -R "${app_path}" "${dmg_root}/"
          cp README.md "${dmg_root}/"
          cp -R docs "${dmg_root}/"
          cp -R assets "${dmg_root}/"

          hdiutil create \
            -volname "DeskPal" \
            -srcfolder "${dmg_root}" \
            -ov \
            -format UDZO \
            "package/${{ matrix.asset_name }}.dmg"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package tools AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/doc/${APP_NAME}
          exe_path="$(find build -type f -name "${APP_NAME}" -executable -print -quit)"
          if [ -z "${exe_path}" ]; then
            echo "${APP_NAME} executable was not found." >&2
            exit 1
          fi

          cp "${exe_path}" "AppDir/usr/bin/${APP_NAME}"
          cp -R assets "AppDir/usr/bin/assets"
          cp assets/icons/DeskPal.svg "AppDir/usr/share/icons/hicolor/scalable/apps/DeskPal.svg"
          cp README.md "AppDir/usr/share/doc/${APP_NAME}/"
          cp -R docs "AppDir/usr/share/doc/${APP_NAME}/"

          cat > "AppDir/usr/share/applications/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=DeskPal
          Comment=Qt desktop pet
          Exec=DeskPal
          Icon=DeskPal
          Categories=Utility;
          Terminal=false
          EOF

          wget -q -O tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-qt-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="${QT_ROOT}/bin/qmake"
          export VERSION="${{ inputs.tag }}"
          export PATH="${PWD}/tools:${PATH}"
          tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable "AppDir/usr/bin/${APP_NAME}" \
            --desktop-file "AppDir/usr/share/applications/${APP_NAME}.desktop" \
            --icon-file "AppDir/usr/share/icons/hicolor/scalable/apps/DeskPal.svg" \
            --plugin qt \
            --output appimage

          generated_appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "${generated_appimage}" ]; then
            echo "Generated AppImage was not found." >&2
            exit 1
          fi
          mv "${generated_appimage}" "package/${{ matrix.asset_name }}.AppImage"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            package/*.zip
            package/*.tar.gz
            package/*.AppImage
            package/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update tag
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Tag ${TAG_NAME} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist

          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          notes_file="$(mktemp)"
          previous_tag="$(git tag --merged "${TAG_NAME}" --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            commit_range="${previous_tag}..${TAG_NAME}"
          else
            commit_range="${TAG_NAME}"
          fi

          mapfile -t features < <(git log "${commit_range}" --format='- %s' --grep='^feat' || true)
          mapfile -t fixes < <(git log "${commit_range}" --format='- %s' --grep='^fix' || true)
          mapfile -t ci_changes < <(git log "${commit_range}" --format='- %s' --grep='^ci' || true)
          mapfile -t other_changes < <(
            git log "${commit_range}" --format='- %s' |
              grep -Ev '^- (feat|fix|ci)(\(.+\))?!?:' || true
          )
          mapfile -t fixed_issues < <(
            git log "${commit_range}" --format='%s%n%b' --grep='^fix' |
              grep -Eio '(fixes|fixed|closes|closed|resolves|resolved)[[:space:]]+#[0-9]+|#[0-9]+' |
              grep -Eo '#[0-9]+' |
              sort -u |
              sed "s#^#- https://github.com/${GITHUB_REPOSITORY}/issues/#" || true
          )

          {
            echo "DeskPal ${TAG_NAME}"
            echo
            if [ -n "${previous_tag}" ]; then
              echo "Changes since ${previous_tag}:"
            else
              echo "Changes:"
            fi
            echo
            if [ "${#features[@]}" -gt 0 ]; then
              echo "Features:"
              printf '%s\n' "${features[@]}"
              echo
            fi
            if [ "${#fixes[@]}" -gt 0 ]; then
              echo "Fixes:"
              printf '%s\n' "${fixes[@]}"
              echo
            fi
            if [ "${#fixed_issues[@]}" -gt 0 ]; then
              echo "Fixed issues:"
              printf '%s\n' "${fixed_issues[@]}"
              echo
            fi
            if [ "${#ci_changes[@]}" -gt 0 ]; then
              echo "CI:"
              printf '%s\n' "${ci_changes[@]}"
              echo
            fi
            if [ "${#other_changes[@]}" -gt 0 ]; then
              echo "Other changes:"
              printf '%s\n' "${other_changes[@]}"
              echo
            fi
            echo "Assets:"
            for asset in "${assets[@]}"; do
              echo "- ${asset}"
            done
            echo
            echo "Note: release uploads all assets built successfully. If one platform build failed, its asset will be absent from this release."
          } > "${notes_file}"

          prerelease_flag=()
          if [ "${PRERELEASE}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes-file "${notes_file}" "${prerelease_flag[@]}"
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* \
              --title "DeskPal ${TAG_NAME}" \
              --notes-file "${notes_file}" \
              "${prerelease_flag[@]}"
          fi
